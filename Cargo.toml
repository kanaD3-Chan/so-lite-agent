# SL Agent workspace（ADR-0008）：引擎 + 内核插件 crate + 官方二进制，最终编译成一个二进制。
#
# - crates/engine        引擎 crate（so-lite-agent，业务无关的通用运行时，内部依赖不发布）
# - crates/plugin-*      内核插件 crate（Linus 模式：仅维护者编译进官方二进制）
# - crates/sl-agent      官方二进制（sl-agent，API 服务，依赖引擎 + 全部内置插件）
#
# 新增内核插件：新建 crates/plugin-<name>/（参考 docs/plugin-dev/reference/），
# 在 members 列表加一行 + 在 crates/sl-agent/Cargo.toml 的 [dependencies] 加一行；
# 注册装配由 crates/sl-agent/build.rs 自动发现（ADR-0036 改造），无需改任何 Rust 代码。

[workspace]
members = ["crates/engine", "crates/sl-agent", "crates/plugin-storage"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# 依赖版本单一来源（各 crate 用 `dep = { workspace = true }` 引用）。
[workspace.dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
jsonschema = "0.49.3"
log = "0.4.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rune = "0.14.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.20.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19" }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
