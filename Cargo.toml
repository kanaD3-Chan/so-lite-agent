[package]
name = "so-lite-agent"
version = "0.1.0"
edition = "2024"
description = "开箱即用的通用 Agent 运行时：agent loop、工具注册与调度、会话、模型 Provider 抽象"
license = "MIT"
keywords = ["agent", "llm", "session", "tools", "async"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
jsonschema = "0.49.3"
log = "0.4.33"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.19" }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
