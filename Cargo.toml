[package]
name = "so-lite-agent"
version = "0.1.0"
edition = "2024"
description = "开箱即用的通用 Agent 运行时：agent loop、工具注册与调度、会话、模型 Provider 抽象"
license = "AGPL-3.0-only"
keywords = ["agent", "llm", "session", "tools", "async"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", optional = true, features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
jsonschema = "0.49.3"
log = "0.4.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rune = { version = "0.14.2", optional = true }
rust-embed = { version = "8.12.0", optional = true }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19" }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[features]
default = []
# Rune 脚本用户插件路径（ADR-0006）：eBPF 模型（安全 VM + requires 宿主函数白名单）。
# 默认关闭——库消费者不背 rune 编译成本；`sl-agent` 二进制启用。
# 启用：cargo add so-lite-agent --features rune-plugins
rune-plugins = ["dep:rune"]
# sl-agent 服务端（HTTP/WS + 内嵌前端）：挂在二进制侧，不进 crate 引擎公共面（ADR-0006）。
server = ["dep:axum", "dep:rust-embed", "tokio/net", "tokio/io-util"]

[[bin]]
name = "sl-agent"
path = "src/bin/sl-agent/main.rs"
required-features = ["server"]

[[example]]
name = "script_plugin"
path = "examples/script_plugin.rs"
required-features = ["rune-plugins"]
